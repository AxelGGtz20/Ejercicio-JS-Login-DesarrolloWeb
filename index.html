<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js"></script>
</head>
<body>
    <section class="login">
        <h1>Login</h1>
        
        <div class="campo">
            <label for="usuario">Escribe tu usuario:</label>
            <input type="text" id="usuario">

            <span id="errorUsuario" class="error"></span>
        </div>

        <div class="campo">
            <label for="psw">Escribe tu contraseña:</label>
            <input type="text" id="psw">

            <span id="errorPsw" class="error"></span>
        </div>

        <div class="botones">
            <button id="btnLogin">Iniciar sesión</button>
            <a href="#" id="olvide">olvidé mi contraseña</a>
        </div>
    </section>

    <!--Ventana para recuperar contraseña-->
    <div id="ventanaRecuperar" class="ventana">
        <div class="ventanaContenido">
            <h2>Restablecer contraseña</h2>

            <label for="correo">Escribe tu correo electrónico:</label>
            <input type="email" id="correo" placeholder="micorreoelectronico@gmail.com">
            <p>Se te enviará un link para restablecer tu contraseña</p>
            <button id="btnRestablecer">Restablecer contraseña</button>
            <button id="btnCerrar">Cerrar</button>
        </div>
    </div>
</body>
</html>
